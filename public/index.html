<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="../src/styles/style.css" />
  </head>
  <body>
    <div class="game-container">
      <h1 class="game-title">Snake Game</h1>
      <div class="score-container">
        <div id="score">Score: 0</div>
        <div id="highScore">High Score: 0</div>
      </div>
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="controls">
        <p>Use arrow keys to control the snake</p>
      </div>
    </div>
    <div class="modal-overlay" id="gameOverModal">
      <div class="modal-content">
        <h2 class="modal-title">Game Over!</h2>
        <p class="modal-text" id="modalScore"></p>
        <button class="modal-button" id="restartButton">Play Again</button>
      </div>
    </div>

    <div class="modal-overlay show welcome-modal" id="welcomeModal">
      <div class="modal-content">
        <h2 class="modal-title">Welcome to Snake!</h2>
        <p class="modal-text">Get ready to play the classic snake game</p>

        <div class="modal-controls">
          <h3 class="modal-controls-title">How to Play</h3>
          <p class="modal-control-item">→ Use arrow keys to move</p>
          <p class="modal-control-item">→ Collect food to grow</p>
          <p class="modal-control-item">→ Avoid hitting walls</p>
          <p class="modal-control-item">→ Don't crash into yourself</p>
        </div>

        <div class="difficulty-buttons">
          <button class="difficulty-button selected" data-speed="150">Easy</button>
          <button class="difficulty-button" data-speed="100">Medium</button>
          <button class="difficulty-button" data-speed="50">Hard</button>
        </div>

        <button class="modal-button" id="startButton">Start Game</button>
      </div>
    </div>
    <script type="module" src="../src/index.js"></script>
  </body>
</html>
